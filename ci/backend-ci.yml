name: backend-ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx ruff
      - name: Lint
        working-directory: backend
        run: python -m ruff check app tests
      - name: Test
        working-directory: backend
        run: python -m pytest -q
      - name: Verify a shared reading offline
        working-directory: backend
        run: python -m app.verify 'engine=tarot&date=2026-09-01&s=demo'
      - name: Test frontend store
        working-directory: frontend
        run: node tests/store.test.mjs
