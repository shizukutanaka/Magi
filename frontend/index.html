<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="世界の占術を横断して、自分の問いを見つめるMagi">
    <title>Magi — 今日の三賢者</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Magi</a>
      <nav aria-label="メインナビゲーション">
        <button type="button" data-view="landing">今日の三賢者</button>
        <button type="button" data-view="reading-form">鑑定</button>
        <button type="button" data-view="history">履歴</button>
      </nav>
    </header>
    <main class="container">
      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section id="view-landing" data-view-panel>
        <p class="eyebrow">Magi / Daily Magi</p>
        <h1>今日の三賢者</h1>
        <p class="lead">異なる伝統の象徴を並べ、今日の問いを静かに見つめます。</p>
        <button id="daily-button" class="primary-button" type="button">今日の鑑定をはじめる</button>
        <p class="privacy-note">ログイン不要。入力は鑑定計算にのみ使われ、サーバには保存されません。</p>
      </section>

      <section id="view-reading-form" data-view-panel hidden>
        <p class="eyebrow">Magi / Reading</p>
        <h1>鑑定</h1>
        <form id="reading-form">
          <label>
            占術
            <select id="engine-id" name="engine_id" required></select>
          </label>
          <label>
            対象日
            <input id="target-date" name="target_date" type="date" required>
          </label>
          <label id="question-field">
            問い（任意）
            <textarea id="question" name="question" rows="3" placeholder="いま心にある問い"></textarea>
          </label>
          <label id="birth-date-field" hidden>
            生年月日
            <input id="birth-date" name="birth_date" type="date">
          </label>
          <label id="birth-time-field" hidden>
            出生時刻
            <input id="birth-time" name="birth_time" type="time">
          </label>
          <label id="full-name-field">
            氏名（任意）
            <input id="full-name" name="full_name" type="text" autocomplete="name">
          </label>
          <label id="spread-field" hidden>
            スプレッド
            <select id="spread" name="spread">
              <option value="three-card">スリーカード</option>
              <option value="celtic-cross">ケルト十字</option>
            </select>
          </label>
          <button class="primary-button" type="submit">鑑定する</button>
        </form>
      </section>

      <section id="view-history" data-view-panel hidden>
        <p class="eyebrow">Magi / Local History</p>
        <h1>履歴</h1>
        <div class="button-row">
          <button id="export-history" type="button">エクスポート</button>
          <button id="clear-history" class="quiet-button" type="button">全削除</button>
        </div>
        <div id="history-list"></div>
      </section>

      <section id="view-result" data-view-panel hidden>
        <div id="result"></div>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
